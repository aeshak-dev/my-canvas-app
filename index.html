<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Excalidraw-Style Vector Canvas</title>
  
  <!-- Fabric.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e0e0e0;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      touch-action: none;
    }

    /* Floating Toolbars */
    .toolbar {
      position: fixed;
      background: rgba(30, 30, 30, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 100;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    /* Main Floating Toolbar - Top Center */
    #main-toolbar {
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Secondary Control Toolbar - Bottom Right */
    #action-toolbar {
      bottom: 16px;
      right: 16px;
    }

    /* Background/Grid Panel - Bottom Left */
    #view-toolbar {
      bottom: 16px;
      left: 16px;
    }

    .tool-btn {
      background: transparent;
      border: none;
      color: #a0a0a0;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .tool-btn.active {
      background: #6366f1;
      color: #ffffff;
    }

    .divider {
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.1);
      margin: 0 4px;
    }

    /* Dropdowns & Color Inputs */
    select, input[type="color"] {
      background: rgba(20, 20, 20, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 6px 10px;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      font-size: 13px;
    }

    input[type="color"] {
      padding: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      overflow: hidden;
    }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }

    /* Zen Mode Hide */
    body.zen-mode .toolbar {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-20px);
    }
  </style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="c"></canvas>
  </div>

  <!-- Main Floating Toolbar -->
  <div id="main-toolbar" class="toolbar">
    <button class="tool-btn active" id="btn-select">🖐️ Pan / Select</button>
    <button class="tool-btn" id="btn-draw">✏️ Draw</button>
    <button class="tool-btn" id="btn-erase-pixel">🧹 Pixel Eraser</button>
    <button class="tool-btn" id="btn-erase-object">❌ Stroke Eraser</button>
    
    <div class="divider"></div>

    <button class="tool-btn" id="btn-rect">🔲 Box</button>
    <button class="tool-btn" id="btn-circle">⚪ Circle</button>
    <button class="tool-btn" id="btn-text">📝 Text</button>

    <div class="divider"></div>

    <label for="color-picker" style="font-size: 12px; color: #a0a0a0;">Stroke:</label>
    <input type="color" id="color-picker" value="#ffffff" />

    <div class="divider"></div>

    <!-- AI Tools Dropdown -->
    <select id="ai-tool-select">
      <option value="" disabled selected>✨ AI Tools ▾</option>
      <option value="diagram">Generate Diagram</option>
      <option value="vision">Analyze Board (Vision)</option>
    </select>
  </div>

  <!-- View Controls -->
  <div id="view-toolbar" class="toolbar">
    <label for="grid-select" style="font-size: 12px; color: #a0a0a0;">Grid Pattern:</label>
    <select id="grid-select">
      <option value="math">Math Grid</option>
      <option value="dots">Dot Grid</option>
      <option value="rule">Single Rule</option>
      <option value="none">None</option>
    </select>
  </div>

  <!-- Action Controls -->
  <div id="action-toolbar" class="toolbar">
    <button class="tool-btn" id="btn-undo">↩️ Undo</button>
    <button class="tool-btn" id="btn-redo">↪️ Redo</button>
    <div class="divider"></div>
    <button class="tool-btn" id="btn-export">📷 Export Note PNG</button>
    <button class="tool-btn" id="btn-save">💾 Save JSON</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
