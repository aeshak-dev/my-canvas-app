<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stylus Whiteboard</title>
  <!-- Fabric.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  
  <style>
    :root {
      --bg-app: #f8f9fa;
      --panel-bg: rgba(255, 255, 255, 0.94);
      --border-color: #e9ecef;
      --text-main: #1e1e1e;
      --text-muted: #868e96;
      --accent: #6965db;
      --accent-hover: #5b57d1;
      --accent-light: #eef2ff;
      --danger: #fa5252;
      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.12);
      --radius-lg: 12px;
      --radius-md: 8px;
      --font-inter: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: var(--font-inter);
      background-color: var(--bg-app);
      color: var(--text-main);
      touch-action: none;
    }

    /* Base Canvas & Container */
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      background-color: #ffffff;
    }

    canvas {
      touch-action: none;
      display: block;
    }

    /* Floating Islands & Cards */
    .excali-island {
      position: absolute;
      z-index: 100;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      border-radius: var(--radius-lg);
      padding: 5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #toolbar {
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
    }

    .island-divider {
      width: 1px;
      height: 20px;
      background: var(--border-color);
      margin: 0 3px;
    }

    /* Buttons Styling */
    .tool-btn, .pill-btn {
      border: none;
      background: transparent;
      color: var(--text-main);
      border-radius: var(--radius-md);
      padding: 8px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .tool-btn:hover, .pill-btn:hover, .tool-btn.active {
      background: var(--accent-light);
      color: var(--accent);
    }

    .tool-btn.danger:hover {
      background: #fff5f5;
      color: var(--danger);
    }

    /* Floating Sidebar Card */
    .excali-card {
      position: absolute;
      z-index: 100;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      border-radius: var(--radius-lg);
      padding: 14px;
    }

    #sidebar {
      top: 76px;
      left: 16px;
      width: 210px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .prop-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .prop-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .color-swatches {
      display: flex;
      gap: 6px;
    }

    .swatch {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .swatch:hover, .swatch.active {
      transform: scale(1.15);
      box-shadow: 0 0 0 2px var(--accent);
    }

    .custom-color-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
    }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch {
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    #hexInput {
      width: 75px;
      border: 1px solid var(--border-color);
      background: #fff;
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 11px;
      color: var(--text-main);
      text-align: center;
      font-family: monospace;
    }

    .thickness-picker {
      display: flex;
      background: #f1f3f5;
      padding: 3px;
      border-radius: var(--radius-md);
      gap: 4px;
    }

    .thick-btn {
      flex: 1;
      height: 28px;
      border: none;
      background: transparent;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thick-btn.active {
      background: #fff;
      box-shadow: var(--shadow-sm);
    }

    .line {
      background: var(--text-main);
      border-radius: 2px;
      width: 18px;
    }

    .line-s { height: 2px; }
    .line-m { height: 4px; }
    .line-l { height: 7px; }

    .grid-picker {
      display: flex;
      gap: 8px;
    }

    select {
      flex: 1;
      padding: 6px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 11px;
      background: #fff;
      outline: none;
    }
  </style>
</head>
<body>

  <!-- Main Canvas Container -->
  <div id="canvas-container">
    <canvas id="drawingCanvas"></canvas>
  </div>

  <!-- Top Action Toolbar -->
  <div id="toolbar" class="excali-island ui-element">
    <button id="handBtn" class="tool-btn" title="Pan Tool">✋ Hand</button>
    <button id="selectBtn" class="tool-btn" title="Select Tool">↖ Select</button>
    <button id="drawBtn" class="tool-btn active" title="Pencil">✏️ Draw</button>
    <button id="eraseBtn" class="tool-btn" title="Freehand Eraser">🧹 Erase</button>
    <button id="strokeEraseBtn" class="tool-btn" title="Stroke Eraser">⚡ Stroke Erase</button>
    
    <div class="island-divider"></div>
    
    <button id="undoBtn" class="pill-btn" title="Undo">↩ Undo</button>
    <button id="redoBtn" class="pill-btn" title="Redo">↪ Redo</button>
    <button id="clearBtn" class="tool-btn danger" title="Clear Canvas">🗑️ Clear</button>
  </div>

  <!-- Left Properties Sidebar -->
  <div id="sidebar" class="excali-card ui-element">
    <!-- Stroke Color Picker -->
    <div class="prop-group">
      <span class="prop-label">Stroke Color</span>
      <div class="color-swatches">
        <div class="swatch active" style="background-color: #1e1e1e;"></div>
        <div class="swatch" style="background-color: #e03131;"></div>
        <div class="swatch" style="background-color: #2f9e44;"></div>
        <div class="swatch" style="background-color: #1971c2;"></div>
        <div class="swatch" style="background-color: #f59f00;"></div>
      </div>
      <div class="custom-color-row">
        <input type="color" id="customColorPicker" value="#1e1e1e">
        <input type="text" id="hexInput" value="#1e1e1e">
      </div>
    </div>

    <!-- Stroke Thickness Picker -->
    <div class="prop-group">
      <span class="prop-label">Thickness</span>
      <div class="thickness-picker">
        <button class="thick-btn active"><div class="line line-s"></div></button>
        <button class="thick-btn"><div class="line line-m"></div></button>
        <button class="thick-btn"><div class="line line-l"></div></button>
      </div>
    </div>

    <!-- Paper Pattern Picker -->
    <div class="prop-group">
      <span class="prop-label">Canvas Pattern</span>
      <div class="grid-picker">
        <select>
          <option value="none">Blank</option>
          <option value="grid">Grid</option>
          <option value="dots">Dots</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Application Script -->
  <script src="app.js"></script>
</body>
</html>
