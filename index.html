<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stylus Whiteboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

  <style>
    :root {
      --bg-app: #121212;
      --panel-bg: rgba(24, 24, 27, 0.94);
      --border-color: rgba(255, 255, 255, 0.12);
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --accent: #a78bfa;
      --accent-light: rgba(167, 139, 250, 0.18);
      --radius-lg: 12px;
      --radius-md: 8px;
      --font-inter: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: var(--font-inter);
      background-color: var(--bg-app);
      color: var(--text-main);
      touch-action: none;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    canvas { touch-action: none; display: block; }

    .ui-element {
      transition: opacity 0.25s ease, transform 0.25s ease;
      opacity: 1;
      pointer-events: auto !important;
      z-index: 100;
    }

    .excali-island, .excali-card {
      position: absolute;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      border-radius: var(--radius-lg);
    }

    /* TOP HEADER */
    #top-header {
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px;
      gap: 6px;
      max-width: calc(100vw - 20px);
      overflow-x: auto;
    }

    .header-section { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .island-divider { width: 1px; height: 20px; background: var(--border-color); margin: 0 2px; flex-shrink: 0; }

    .tool-btn {
      border: none;
      background: transparent;
      color: var(--text-main);
      border-radius: var(--radius-md);
      padding: 6px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s ease;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .tool-btn:hover { background: var(--accent-light); color: var(--accent); }
    .tool-btn:active { transform: scale(0.95); }
    .tool-btn.active { background: var(--accent); color: #000; }

    /* AI MENU DROPDOWN */
    .ai-dropdown-wrapper { position: relative; }

    .ai-trigger-btn {
      background: rgba(167, 139, 250, 0.12);
      border: 1px solid rgba(167, 139, 250, 0.3);
      color: var(--accent);
    }
    .ai-trigger-btn:hover { background: rgba(167, 139, 250, 0.25); }

    .ai-menu {
      display: none;
      position: absolute;
      bottom: calc(100% + 8px);
      left: 0;
      min-width: 160px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      backdrop-filter: blur(14px);
      flex-direction: column;
      padding: 4px;
      z-index: 101;
    }

    .ai-menu.open { display: flex; }

    .ai-menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 12px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
    }

    .ai-menu-item:hover { background: var(--accent-light); color: var(--accent); }

    /* BOTTOM TOOLBAR WRAPPER */
    #toolbar-wrapper {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 100;
      width: max-content;
      max-width: calc(100vw - 20px);
    }

    #excali-toolbar {
      position: relative;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      max-width: 100%;
      overflow-x: auto;
    }

    /* LEFT SIDEBAR */
    #sidebar {
      top: 60px;
      left: 10px;
      width: 180px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: calc(100vh - 140px);
      overflow-y: auto;
    }

    .prop-group { display: flex; flex-direction: column; gap: 6px; }
    .prop-label { font-size: 9px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
    
    .color-swatches { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    .swatch { width: 22px; height: 22px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; }
    .swatch.active { outline: 2px solid var(--accent); }

    .color-picker-wrapper {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.3);
      position: relative;
      background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
      cursor: pointer;
    }

    .color-picker-input {
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      position: absolute;
      top: 0;
      left: 0;
    }

    .grid-toggle-group { display: flex; flex-wrap: wrap; gap: 4px; }
    .grid-btn {
      flex: 1 1 45%;
      padding: 4px 6px;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-main);
      border-radius: var(--radius-md);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .grid-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

    #hiddenFileInput { display: none; }
  </style>
</head>
<body>

  <input type="file" id="hiddenFileInput" accept=".json,image/*" />

  <!-- Top Header -->
  <div id="top-header" class="ui-element excali-island">
    <div class="header-section">
      <button id="undoBtn" class="tool-btn" title="Undo">↩️ Undo</button>
      <button id="redoBtn" class="tool-btn" title="Redo">↪️ Redo</button>
      <div class="island-divider"></div>
      <button id="clearBtn" class="tool-btn" title="Clear Canvas">🗑️ Clear</button>
    </div>

    <div class="header-section">
      <button id="exportImgBtn" class="tool-btn" style="background: rgba(16, 185, 129, 0.2); color: #10b981;">🖼️ Export</button>
      <div class="island-divider"></div>
      <button id="downloadBtn" class="tool-btn" title="Save File">💾 Save</button>
      <button id="loadBtn" class="tool-btn" title="Open File">📂 Open</button>
    </div>
  </div>

  <!-- Bottom Toolbar -->
  <div id="toolbar-wrapper" class="ui-element">
    <div id="excali-toolbar" class="excali-island">
      <button id="handBtn" class="tool-btn" title="Hand (Pan Mode)">🖐️</button>
      <button id="selectBtn" class="tool-btn" title="Selection Mode">👆</button>
      <button id="drawBtn" class="tool-btn active" title="Draw Pencil">✏️</button>
      <button id="eraseBtn" class="tool-btn" title="Freeform Eraser">🧹</button>
      <button id="strokeEraseBtn" class="tool-btn" title="Stroke Eraser (Delete full stroke)">💥</button>
      <div class="island-divider"></div>
      <button id="rectBtn" class="tool-btn" title="Rectangle">▭</button>
      <button id="circleBtn" class="tool-btn" title="Circle">◯</button>
      <button id="textBtn" class="tool-btn" title="Text">A</button>
      
      <div class="island-divider"></div>

      <!-- AI DROPDOWN -->
      <div class="ai-dropdown-wrapper">
        <button id="aiMenuTrigger" class="tool-btn ai-trigger-btn" title="AI Tools">✨ AI Tools ▾</button>
        <div id="aiMenu" class="ai-menu">
          <button id="aiDiagramBtn" class="ai-menu-item">🔮 Diagram</button>
          <button id="aiImageBtn" class="ai-menu-item">🖼️ Insert Image</button>
          <button id="aiVisionBtn" class="ai-menu-item">👁️ Vision Analysis</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Left Sidebar -->
  <div id="sidebar" class="ui-element excali-card">
    <div class="prop-group">
      <label class="prop-label">Stroke Color</label>
      <div class="color-swatches">
        <button class="swatch stroke-swatch active" style="background: #ffffff" data-color="#ffffff"></button>
        <button class="swatch stroke-swatch" style="background: #ef4444" data-color="#ef4444"></button>
        <button class="swatch stroke-swatch" style="background: #22c55e" data-color="#22c55e"></button>
        <button class="swatch stroke-swatch" style="background: #3b82f6" data-color="#3b82f6"></button>
        <button class="swatch stroke-swatch" style="background: #eab308" data-color="#eab308"></button>
        <div class="color-picker-wrapper" title="Custom Stroke Color">
          <input type="color" id="customColorPicker" class="color-picker-input" value="#ffffff">
        </div>
      </div>
    </div>

    <div class="prop-group">
      <label class="prop-label">Canvas Background</label>
      <div class="color-swatches">
        <button class="swatch bg-swatch active" style="background: #121212" data-bg="#121212"></button>
        <button class="swatch bg-swatch" style="background: #1e1e24" data-bg="#1e1e24"></button>
        <button class="swatch bg-swatch" style="background: #f8fafc" data-bg="#f8fafc"></button>
        <button class="swatch bg-swatch" style="background: #fef3c7" data-bg="#fef3c7"></button>
        <div class="color-picker-wrapper" title="Custom Canvas BG">
          <input type="color" id="customBgPicker" class="color-picker-input" value="#121212">
        </div>
      </div>
    </div>

    <div class="prop-group">
      <label class="prop-label">Paper Pattern</label>
      <div class="grid-toggle-group">
        <button class="grid-btn active" data-grid="grid">Math Grid</button>
        <button class="grid-btn" data-grid="ruled">Single Rule</button>
        <button class="grid-btn" data-grid="dots">Dot Grid</button>
        <button class="grid-btn" data-grid="none">None</button>
      </div>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="drawingCanvas"></canvas>
  </div>

  <script src="app.js"></script>
</body>
</html>
